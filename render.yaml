services:
  - type: web
    name: davandy
    runtime: node
    plan: starter
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /data
    disk:
      name: davandy-data
      mountPath: /data
      sizeGB: 1
